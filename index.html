<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Budget" />
  <title>Budget — 100% privé, 100% local</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" href="icon-192.png" />
  <style>
:root {
  color-scheme: light;
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #eef0f3;
  --text: #1f2933;
  --muted: #6b7680;
  --border: #e1e4e8;
  --primary: #2a78d6;
  --primary-dark: #2263b0;
  --pos: #0f8a4f;
  --neg: #d63c3c;
  --warn: #c77c00;
  --s-income: #2a78d6;
  --s-expense: #eb6834;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --radius: 10px;
  --gap: 14px;
  --bar-bg: #e6e9ed;
  --overlay: rgba(10,15,25,.45);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #111418; --surface: #1b1f25; --surface-2: #20252c; --surface-3: #282e36;
    --text: #e9ecef; --muted: #98a2ad; --border: #2d343c;
    --primary: #4a93ec; --primary-dark: #3987e5;
    --pos: #3ccf86; --neg: #ff6b6b; --warn: #f0a93a;
    --s-income: #3987e5; --s-expense: #d95926;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
    --bar-bg: #2d343c; --overlay: rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111418; --surface: #1b1f25; --surface-2: #20252c; --surface-3: #282e36;
  --text: #e9ecef; --muted: #98a2ad; --border: #2d343c;
  --primary: #4a93ec; --primary-dark: #3987e5;
  --pos: #3ccf86; --neg: #ff6b6b; --warn: #f0a93a;
  --s-income: #3987e5; --s-expense: #d95926;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  --bar-bg: #2d343c; --overlay: rgba(0,0,0,.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; display: flex; flex-direction: column; }
body.modal-open { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); font-size: 13px; }
.tnum { font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); }

/* ---------- header / nav ---------- */
#app-header { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); padding-top: env(safe-area-inset-top); }
.topbar { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 6px 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 16px; margin-right: 8px; }
.main-nav { display: none; gap: 2px; }
.nav-btn { background: none; border: none; padding: 9px 12px; color: var(--muted); border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; }
.nav-btn:hover { color: var(--text); background: var(--surface-2); }
.nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
.month-nav { display: flex; align-items: center; gap: 4px; margin: 0 auto; }
.month-label { min-width: 150px; text-align: center; text-transform: capitalize; font-weight: 600; font-size: 16px; }
.month-spacer { width: 1px; }

#tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom); }
.tab { flex: 1; background: none; border: none; padding: 7px 2px 6px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; }
.tab .ico { font-size: 20px; line-height: 1.2; }
.tab.active { color: var(--primary); font-weight: 600; }

#app-main { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; padding: 14px 12px calc(150px + env(safe-area-inset-bottom)); }

.fab { position: fixed; right: 16px; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 25; width: 56px; height: 56px; border-radius: 50%;
  border: none; background: var(--primary); color: #fff; font-size: 30px; line-height: 1; box-shadow: 0 4px 14px rgba(0,0,0,.28); }
.fab:active { transform: scale(.95); }

@media (min-width: 860px) {
  #tabbar { display: none; }
  .main-nav { display: flex; }
  #app-main { padding: 20px 20px 100px; }
  .fab { bottom: 28px; right: 28px; }
}

/* ---------- buttons ---------- */
.btn { background: var(--surface); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { background: var(--neg); border-color: var(--neg); color: #fff; }
.btn-danger:hover { filter: brightness(.92); background: var(--neg); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--primary); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { padding: 5px 10px; font-size: 13px; }
.btn-block { width: 100%; justify-content: center; }
.icon-btn { background: transparent; border: none; font-size: 20px; width: 34px; height: 34px; border-radius: 50%; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
label.btn input[type=file] { display: none; }

/* ---------- layout bits ---------- */
.section { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; margin-bottom: var(--gap); box-shadow: var(--shadow); }
.section h2, .page-title { margin: 0; font-size: 18px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { color: var(--muted); text-align: center; padding: 18px 8px; margin: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: var(--gap); }
@media (min-width: 860px) { .grid-2 { grid-template-columns: 1fr 1fr; } }

.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: var(--gap); }
@media (min-width: 640px) { .cards { grid-template-columns: repeat(4, 1fr); } }
.card { background: var(--surface); padding: 12px 14px; border-radius: var(--radius); box-shadow: var(--shadow); border-left: 4px solid var(--primary); min-width: 0; }
.card.pos { border-left-color: var(--pos); } .card.neg { border-left-color: var(--neg); }
.card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.card-value { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.card-sub { font-size: 12px; color: var(--muted); }

.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--radius); margin-bottom: var(--gap);
  background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border)); font-size: 14px; }
.banner.err { background: color-mix(in srgb, var(--neg) 14%, var(--surface)); border-color: color-mix(in srgb, var(--neg) 45%, var(--border)); }
.banner.info { background: color-mix(in srgb, var(--primary) 12%, var(--surface)); border-color: color-mix(in srgb, var(--primary) 40%, var(--border)); }
.banner .actions { margin-left: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 99px; background: var(--surface-3); font-size: 12px; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pill.pos { background: color-mix(in srgb, var(--pos) 15%, transparent); } .pill.neg { background: color-mix(in srgb, var(--neg) 15%, transparent); }

/* ---------- accounts ---------- */
.account-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; }
.account-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; }
.account-card:hover { border-color: var(--primary); }
.account-name { font-weight: 600; }
.account-balance { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.account-type { font-size: 12px; color: var(--muted); }
.arow { display: grid; grid-template-columns: 1fr auto 34px; gap: 8px; align-items: center; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
.arow:hover { background: var(--surface-3); }
.arow.archived { opacity: .65; }

/* ---------- envelopes ---------- */
.erow { display: grid; grid-template-columns: 14px 1fr 1fr 1fr; grid-template-areas: "dot name name act" ". budget spent avail" "bar bar bar bar";
  gap: 4px 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--surface-2); border-radius: 8px; align-items: center; }
.erow.hdr { display: none; }
.erow .dot { grid-area: dot; } .erow .name { grid-area: name; font-weight: 600; min-width: 0; cursor: pointer; }
.erow .budget { grid-area: budget; } .erow .spent { grid-area: spent; } .erow .avail { grid-area: avail; font-weight: 700; }
.erow .bar { grid-area: bar; } .erow .act { grid-area: act; justify-self: end; }
.erow .lbl { display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; font-weight: 400; }
.erow .avail.warn { color: var(--warn); } .erow .avail.neg { color: var(--neg); } .erow .avail.ok { color: var(--pos); }
.dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.bar { height: 8px; background: var(--bar-bg); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--pos); border-radius: 4px; transition: width .2s; }
.bar > i.warn { background: var(--warn); } .bar > i.over { background: var(--neg); }
.tag { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 4px; }
@media (min-width: 760px) {
  .erow { grid-template-columns: 14px minmax(120px, 1.5fr) 120px 1fr 1fr 40px; grid-template-areas: "dot name budget spent avail act" "bar bar bar bar bar bar"; }
  .erow.hdr { display: grid; grid-template-areas: "dot name budget spent avail act"; background: transparent; padding-bottom: 0; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .erow .lbl { display: none; }
}
.eline { display: grid; grid-template-columns: 12px 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 4px; cursor: pointer; border-radius: 6px; }
.eline:hover { background: var(--surface-2); }
.eline .bar { grid-column: 2 / 4; }
.eline .nm { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eline .am { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); }
.eline .am b { color: var(--text); }

/* ---------- transactions ---------- */
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; padding: 10px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
.filters .wide { grid-column: 1 / -1; }
.filters select, .filters input[type=search] { width: 100%; }
.filters-foot { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters-foot .pills { margin-left: auto; display: flex; gap: 6px; }
@media (min-width: 760px) { .filters { grid-template-columns: 2fr 1fr 1fr; } .filters .wide { grid-column: auto; } }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.day-head { display: flex; justify-content: space-between; padding: 12px 6px 4px; font-size: 12px; color: var(--muted); text-transform: capitalize; font-weight: 600; letter-spacing: .3px; }
.tx-row { display: grid; grid-template-columns: 12px 1fr auto 30px; gap: 10px; padding: 10px 12px; background: var(--surface); border-radius: 8px; align-items: center; cursor: pointer; margin-bottom: 3px; box-shadow: var(--shadow); }
.tx-row:hover { background: var(--surface-2); }
.tx-main { min-width: 0; }
.tx-payee { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-meta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx-amount { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.tx-amount.xfer { color: var(--muted); }
.tx-del { visibility: hidden; }
.tx-row:hover .tx-del { visibility: visible; }
@media (hover: none) { .tx-del { display: none; } .tx-row { grid-template-columns: 12px 1fr auto; } }

/* ---------- charts ---------- */
.viz { --viz-income: var(--s-income); --viz-expense: var(--s-expense); }
.donut-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
.donut-wrap svg { width: 170px; height: 170px; flex-shrink: 0; }
.legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 190px; display: grid; gap: 4px; }
.legend li { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; font-size: 13px; }
.legend .pct { color: var(--muted); width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.legend .v { font-variant-numeric: tabular-nums; }
.key { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-right: 12px; }
.key i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.bars svg { width: 100%; height: auto; display: block; }
.bars text { fill: var(--muted); font-size: 10px; }
.bars .grid { stroke: var(--border); stroke-width: 1; }
.bars .axis { stroke: var(--muted); stroke-width: 1; opacity: .6; }
.donut-center { fill: var(--text); font-weight: 700; font-size: 14px; }
.donut-sub { fill: var(--muted); font-size: 9px; }

/* ---------- modal ---------- */
.modal-overlay { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.3); width: 100%; max-width: 480px; max-height: 92vh; display: flex; flex-direction: column; }
.modal-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.modal-header h2 { margin: 0; font-size: 17px; }
.modal-body { padding: 14px 18px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
.modal-actions .spacer { margin-right: auto; }
@media (max-width: 640px) {
  .modal-overlay { align-items: flex-end; padding: 0; }
  .modal { max-width: none; border-radius: 16px 16px 0 0; max-height: 94vh; padding-bottom: env(safe-area-inset-bottom); }
}

/* ---------- forms ---------- */
.form { display: flex; flex-direction: column; gap: 12px; }
.form-row { display: flex; flex-direction: column; gap: 4px; }
.form-row > label { font-size: 12px; color: var(--muted); font-weight: 600; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input[type=text], input[type=search], input[type=date], input[type=number], select, textarea {
  padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; background: var(--surface); color: var(--text); width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 22%, transparent); }
input[type=color] { width: 60px; height: 38px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--primary); }
.amount-input { font-size: 26px !important; font-weight: 700; text-align: center; }
.input-sm { padding: 6px 8px !important; font-size: 15px !important; text-align: right; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-3); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: none; background: transparent; padding: 8px 4px; border-radius: 8px; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.seg button.on[data-v="expense"] { color: var(--neg); } .seg button.on[data-v="income"] { color: var(--pos); }
.checkrow { display: flex; gap: 10px; align-items: center; font-size: 14px; }
table.preview { width: 100%; border-collapse: collapse; font-size: 12px; }
table.preview td, table.preview th { padding: 3px 6px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(16px); background: #26303a; color: #fff; padding: 10px 16px;
  border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s, transform .2s; z-index: 200; box-shadow: 0 4px 12px rgba(0,0,0,.25); display: flex; gap: 14px; align-items: center; max-width: 92vw; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-success { background: #167a49; } .toast-error { background: #c0392b; }
.toast button { background: none; border: none; color: #fff; font-weight: 700; text-decoration: underline; padding: 0; }
@media (min-width: 860px) { .toast { bottom: 24px; } }

.rec-row { display: grid; grid-template-columns: 1fr auto 34px; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; margin-bottom: 6px; }
.rec-row.off { opacity: .6; }

/* ---------- v2 : intelligence & ludique ---------- */
.qbar { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 12px; margin-bottom: var(--gap); border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--border)); }
.qrow { display: flex; align-items: center; gap: 8px; }
.qi { font-size: 18px; }
.qrow input { border: none; box-shadow: none !important; padding: 8px 4px; background: transparent; }
.qprev { margin-top: 6px; }
.chip.strong { font-weight: 700; } .chip.neg { color: var(--neg); } .chip.pos { color: var(--pos); }
.hero { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; margin-bottom: var(--gap); border-radius: var(--radius); cursor: pointer;
  background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 16%, var(--surface)), var(--surface)); box-shadow: var(--shadow); border: 1px solid color-mix(in srgb, var(--primary) 25%, var(--border)); }
.hero-v { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
.hero-i { color: var(--muted); font-size: 20px; }
.minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-bottom: var(--gap); }
.mini { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 14px; cursor: pointer; }
.mini .big { font-size: 40px; width: 64px; text-align: center; }
.ring-t { fill: var(--text); font-weight: 800; } .ring-s { fill: var(--muted); }
.insight { display: grid; grid-template-columns: 28px 1fr 34px; grid-template-areas: 'ii it x' '. act .'; gap: 4px 10px; align-items: center; padding: 9px 10px; border-radius: 8px; margin-bottom: 6px; background: var(--surface-2); border-left: 4px solid var(--primary); }
.insight.warn { border-left-color: var(--warn); } .insight.ok { border-left-color: var(--pos); }
.insight .ii { font-size: 20px; grid-area: ii; } .insight .it { grid-area: it; font-size: 14px; min-width: 0; }
.insight .act { grid-area: act; justify-self: start; } .insight .x { grid-area: x; }
.goal { display: flex; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.goal:last-child { border-bottom: none; }
.score { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: center; }
.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tool { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; text-align: left; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; }
.tool:hover { border-color: var(--primary); }
.tool .ti { font-size: 24px; }
.tool.wide { flex-direction: row; align-items: center; gap: 14px; width: 100%; background: var(--surface); box-shadow: var(--shadow); }
.menu { display: grid; gap: 10px; }
@media (min-width: 760px) { .menu { grid-template-columns: 1fr 1fr; } }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.badge { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 10px 6px; border-radius: var(--radius); background: var(--surface-2); filter: grayscale(1); opacity: .55; font-size: 13px; }
.badge.on { filter: none; opacity: 1; background: color-mix(in srgb, var(--warn) 12%, var(--surface-2)); }
.badge .bi { font-size: 28px; } .badge .muted { font-size: 11px; }
.hm { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 420px; }
.hm-h { text-align: center; font-size: 11px; color: var(--muted); }
.hm-c { aspect-ratio: 1; border-radius: 6px; background: var(--surface-3); display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; font-variant-numeric: tabular-nums; }
.verdict { padding: 12px 14px; border-radius: var(--radius); display: grid; gap: 4px; background: color-mix(in srgb, var(--pos) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--pos) 40%, var(--border)); }
.verdict.warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }

<body>
  <header id="app-header"></header>
  <main id="app-main"></main>
  <button id="fab" class="fab" aria-label="Nouvelle opération" type="button">+</button>
  <nav id="tabbar" aria-label="Navigation principale"></nav>
  <script>
// ============================================================
// db.js — stockage local (localStorage), avec cache mémoire.
// Mêmes clés que l'ancienne version : les données existantes sont conservées.
// ============================================================
const DB = (() => {
  const PREFIX = 'budget-app__';
  const STORES = ['accounts', 'envelopes', 'envelopeBudgets', 'transactions', 'recurring', 'goals', 'settings'];
  const TX_TYPES = ['expense', 'income', 'transfer'];
  const cache = {};
  const status = { persistent: true, ok: true, lastError: null };

  function probe() {
    try { localStorage.setItem('__budget_probe__', '1'); localStorage.removeItem('__budget_probe__'); return true; }
    catch { return false; }
  }
  status.persistent = probe();

  const idField = (s) => (s === 'settings' ? 'key' : 'id');

  function load(s) {
    if (cache[s]) return cache[s];
    let rows = [];
    if (status.persistent) {
      try {
        const raw = localStorage.getItem(PREFIX + s);
        if (raw) { const p = JSON.parse(raw); if (Array.isArray(p)) rows = p; }
      } catch (e) { console.warn('db: lecture impossible', s, e); }
    }
    cache[s] = rows;
    return rows;
  }

  function persist(s) {
    if (!status.persistent) { status.ok = false; return false; }
    try {
      localStorage.setItem(PREFIX + s, JSON.stringify(cache[s]));
      status.ok = true;
      return true;
    } catch (e) {
      status.ok = false; status.lastError = String(e);
      console.warn('db: écriture impossible', s, e);
      window.dispatchEvent(new CustomEvent('db-error'));
      return false;
    }
  }

  const all = (s) => load(s).slice();
  const get = (s, id) => load(s).find((r) => r[idField(s)] === id) || null;

  function put(s, value) {
    const rows = load(s), f = idField(s);
    const i = rows.findIndex((r) => r[f] === value[f]);
    if (i >= 0) rows[i] = value; else rows.push(value);
    persist(s);
    return value;
  }
  function putMany(s, values) {
    const rows = load(s), f = idField(s);
    const idx = new Map(rows.map((r, i) => [r[f], i]));
    for (const v of values) {
      if (idx.has(v[f])) rows[idx.get(v[f])] = v;
      else { idx.set(v[f], rows.length); rows.push(v); }
    }
    persist(s);
  }
  function del(s, id) { delMany(s, [id]); }
  function delMany(s, ids) {
    const set = new Set(ids), f = idField(s);
    cache[s] = load(s).filter((r) => !set.has(r[f]));
    persist(s);
  }

  const getSetting = (key, fallback = null) => { const r = get('settings', key); return r ? r.value : fallback; };
  const setSetting = (key, value) => put('settings', { key, value });

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  function invalidate() { for (const k of Object.keys(cache)) delete cache[k]; }

  // ----- nettoyage / validation à l'import -----
  const isStr = (x) => typeof x === 'string' && x.length > 0;
  const num = (x, d = 0) => { const n = Number(x); return Number.isFinite(n) ? n : d; };
  const RE_DATE = /^\d{4}-\d{2}-\d{2}$/, RE_YM = /^\d{4}-\d{2}$/;
  const sanitizers = {
    accounts: (r) => isStr(r.id) && isStr(r.name) ? { id: r.id, name: String(r.name).slice(0, 80), type: String(r.type || 'Autre'), openingBalance: num(r.openingBalance), archived: !!r.archived, createdAt: num(r.createdAt, Date.now()) } : null,
    envelopes: (r) => isStr(r.id) && isStr(r.name) ? { id: r.id, name: String(r.name).slice(0, 80), color: /^#[0-9a-f]{6}$/i.test(r.color) ? r.color : '#3498db', group: String(r.group || '').slice(0, 60), defaultBudget: Math.max(0, num(r.defaultBudget)), rollover: !!r.rollover, archived: !!r.archived, createdAt: num(r.createdAt, Date.now()) } : null,
    envelopeBudgets: (r) => isStr(r.id) && isStr(r.envelopeId) && RE_YM.test(r.yearMonth) ? { id: r.id, envelopeId: r.envelopeId, yearMonth: r.yearMonth, amount: Math.max(0, num(r.amount)) } : null,
    transactions: (r) => isStr(r.id) && RE_DATE.test(r.date) && TX_TYPES.includes(r.type) && Number.isFinite(Number(r.amount)) && isStr(r.accountId)
      ? { id: r.id, date: r.date, accountId: r.accountId, toAccountId: r.type === 'transfer' && isStr(r.toAccountId) ? r.toAccountId : null, envelopeId: r.type === 'expense' && isStr(r.envelopeId) ? r.envelopeId : null, type: r.type, amount: Math.abs(num(r.amount)), payee: String(r.payee || '').slice(0, 120), notes: String(r.notes || '').slice(0, 300), recurringId: isStr(r.recurringId) ? r.recurringId : null, createdAt: num(r.createdAt, Date.now()) } : null,
    recurring: (r) => isStr(r.id) && TX_TYPES.includes(r.type) && isStr(r.accountId) && RE_DATE.test(r.startDate)
      ? { id: r.id, type: r.type, accountId: r.accountId, toAccountId: isStr(r.toAccountId) ? r.toAccountId : null, envelopeId: isStr(r.envelopeId) ? r.envelopeId : null, amount: Math.abs(num(r.amount)), payee: String(r.payee || '').slice(0, 120), notes: String(r.notes || '').slice(0, 300), day: Math.min(31, Math.max(1, Math.round(num(r.day, 1)))), startDate: r.startDate, active: r.active !== false, generated: Array.isArray(r.generated) ? r.generated.filter((x) => RE_YM.test(x)) : [], createdAt: num(r.createdAt, Date.now()) } : null,
    goals: (r) => isStr(r.id) && isStr(r.name) && Number(r.target) > 0 ? { id: r.id, name: String(r.name).slice(0, 80), emoji: String(r.emoji || '🎯').slice(0, 4), target: Math.abs(num(r.target)), saved: Math.max(0, num(r.saved)), deadline: RE_DATE.test(r.deadline) ? r.deadline : null, color: /^#[0-9a-f]{6}$/i.test(r.color) ? r.color : '#2a78d6', createdAt: num(r.createdAt, Date.now()) } : null,
    settings: (r) => isStr(r.key) ? { key: r.key, value: r.value } : null,
  };

  function exportAll() {
    const out = { app: 'budget', version: 2, exportedAt: new Date().toISOString() };
    for (const s of STORES) out[s] = all(s);
    return out;
  }

  // Retourne { imported, rejected } ; lève une erreur si le fichier n'a pas la bonne forme.
  function importAll(data, { merge = false } = {}) {
    if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('Fichier invalide');
    const known = STORES.filter((s) => Array.isArray(data[s]));
    if (!known.length) throw new Error('Ce fichier ne ressemble pas à une sauvegarde Budget');
    // 1) on valide tout AVANT de toucher aux données existantes
    const clean = {}; let rejected = 0;
    for (const s of known) {
      clean[s] = [];
      for (const r of data[s]) {
        const ok = r && typeof r === 'object' ? sanitizers[s](r) : null;
        if (ok) clean[s].push(ok); else rejected++;
      }
    }
    // 2) on applique
    let imported = 0;
    for (const s of STORES) {
      if (!merge) cache[s] = [];
      if (clean[s]) { const rows = load(s); const f = idField(s); const m = new Map(rows.map((r) => [r[f], r])); for (const r of clean[s]) m.set(r[f], r); cache[s] = [...m.values()]; imported += clean[s].length; }
      persist(s);
    }
    return { imported, rejected };
  }

  function wipeAll() { for (const s of STORES) { cache[s] = []; persist(s); } }

  return { status, uid, all, get, put, putMany, del, delMany, getSetting, setSetting, exportAll, importAll, wipeAll, invalidate };
})();

// ============================================================
// util.js — formats, dates, DOM, CSV
// ============================================================
const U = (() => {
  const round2 = (n) => Math.round((Number(n) + Number.EPSILON) * 100) / 100;

  const fmtCache = {};
  function fmtMoney(amount, currency = 'EUR') {
    const n = Number(amount) || 0;
    try {
      const f = fmtCache[currency] || (fmtCache[currency] = new Intl.NumberFormat('fr-FR', { style: 'currency', currency }));
      return f.format(n === 0 ? 0 : n); // évite « -0,00 € »
    } catch { return `${n.toFixed(2)} ${currency}`; }
  }
  const fmtSigned = (n, cur) => (n < 0 ? '−' : n > 0 ? '+' : '') + fmtMoney(Math.abs(n), cur);
  const fmtInput = (n) => (n === '' || n == null ? '' : String(n).replace('.', ','));
  const fmtPct = (x) => `${Math.round(x * 100)} %`;

  // « 1 234,56 », « 1.234,56 », « 12.5 », « -12,5 € » -> nombre ; NaN si illisible
  function parseNumber(input) {
    if (input == null) return NaN;
    let s = String(input).trim().replace(/[\s  €$£+]/g, '');
    if (!s) return NaN;
    let neg = false;
    if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
    if (s.startsWith('-') || s.startsWith('−')) { neg = !neg; s = s.slice(1); }
    if (s.endsWith('-')) { neg = !neg; s = s.slice(0, -1); }
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc >= 0 && ld >= 0) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    else if (lc >= 0) s = s.replace(',', '.');
    if (!/^\d*\.?\d+$|^\d+\.?$/.test(s)) return NaN;
    const n = parseFloat(s);
    return Number.isFinite(n) ? (neg ? -n : n) : NaN;
  }

  // ---- dates ----
  const pad = (n) => String(n).padStart(2, '0');
  const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => isoOf(new Date());
  const todayYM = () => todayISO().slice(0, 7);
  function shiftYM(ym, delta) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + delta, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
  function ymLabel(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }); }
  function ymShort(ym) { const [y, m] = ym.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('fr-FR', { month: 'short' }).replace('.', ''); }
  const daysInMonth = (ym) => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
  const dateFor = (ym, day) => `${ym}-${pad(Math.min(day, daysInMonth(ym)))}`;
  function dayLabel(iso) {
    const t = todayISO();
    if (iso === t) return "Aujourd'hui";
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (iso === isoOf(y)) return 'Hier';
    const [yy, mm, dd] = iso.split('-').map(Number);
    return new Date(yy, mm - 1, dd).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  const validISO = (s) => /^\d{4}-\d{2}-\d{2}$/.test(s) && !Number.isNaN(Date.parse(s));

  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();

  // ---- DOM ----
  function el(tag, attrs, ...children) {
    const n = document.createElement(tag);
    let value;
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'dataset') Object.assign(n.dataset, v);
      else if (k === 'value') value = v;
      else if (k === 'checked' || k === 'selected') n[k] = !!v;
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, '');
      else n.setAttribute(k, v);
    }
    for (const c of children.flat(Infinity)) {
      if (c === null || c === undefined || c === false) continue;
      n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
    }
    if (value !== undefined) n.value = value;   // après les <option>, sinon un <select> perd sa valeur
    return n;
  }
  const SVGNS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs, ...children) {
    const n = document.createElementNS(SVGNS, tag);
    for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) n.setAttribute(k, v);
    for (const c of children.flat()) if (c) n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
    return n;
  }

  // ---- CSV ----
  function detectDelimiter(text) {
    const first = text.split(/\r?\n/).find((l) => l.trim()) || '';
    const counts = { ';': (first.match(/;/g) || []).length, '\t': (first.match(/\t/g) || []).length, ',': (first.match(/,/g) || []).length };
    return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][1] > 0 ? Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0] : ';';
  }
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const delim = detectDelimiter(text);
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === delim) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some((x) => x.trim() !== '')) rows.push(row); row = []; }
      else cell += c;
    }
    row.push(cell); if (row.some((x) => x.trim() !== '')) rows.push(row);
    return rows;
  }
  function toCSV(rows, delim = ';') {
    const esc = (v) => {
      let s = v == null ? '' : String(v);
      if (/^[=+\-@\t\r]/.test(s) && !/^-?\d+([.,]\d+)?$/.test(s)) s = "'" + s;   // anti-injection de formules
      return /[";\n\r]/.test(s) || s.includes(delim) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    return '﻿' + rows.map((r) => r.map(esc).join(delim)).join('\r\n');
  }
  function parseDateLoose(s) {
    s = String(s || '').trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
    m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
    if (m) { let y = Number(m[3]); if (y < 100) y += 2000; const iso = `${y}-${pad(m[2])}-${pad(m[1])}`; return validISO(iso) ? iso : null; }
    return null;
  }

  return { round2, fmtMoney, fmtSigned, fmtInput, fmtPct, parseNumber, pad, isoOf, todayISO, todayYM, shiftYM, ymLabel, ymShort, daysInMonth, dateFor, dayLabel, validISO, norm, el, svg, parseCSV, toCSV, parseDateLoose };
})();
const { el, svg } = U;

// ============================================================
// core.js — état, calculs dérivés, modales, toasts, actions
// ============================================================
const state = {
  view: 'dashboard',
  month: U.todayYM(),
  currency: 'EUR',
  theme: 'auto',
  filters: { accountId: '', envelopeId: '', q: '', all: false },
  limit: 150,
  data: { accounts: [], envelopes: [], envelopeBudgets: [], transactions: [], recurring: [], goals: [] },
  version: 0,
};
let _calc = null;

function reloadData() {
  state.data = {
    accounts: DB.all('accounts'),
    envelopes: DB.all('envelopes'),
    envelopeBudgets: DB.all('envelopeBudgets'),
    transactions: DB.all('transactions'),
    recurring: DB.all('recurring'),
    goals: DB.all('goals'),
  };
  state.currency = DB.getSetting('currency', 'EUR') || 'EUR';
  state.theme = DB.getSetting('theme', 'auto') || 'auto';
  state.version++;
  _calc = null;
}
function commit() { reloadData(); try { checkBadges(); } catch (e) { console.warn(e); } render(); }
const money = (n) => U.fmtMoney(n, state.currency);

// ------------------------------------------------------------
// Calculs dérivés (reconstruits à chaque changement de données)
// ------------------------------------------------------------
function C() {
  if (_calc) return _calc;
  const d = state.data;
  const spent = new Map(), inc = new Map(), exp = new Map(), unc = new Map(), bal = new Map(), over = new Map(), first = new Map(), payees = new Map(), tokenVotes = new Map();
  const add = (m, k, v) => m.set(k, (m.get(k) || 0) + v);
  const touch = (envId, ym) => { if (!first.has(envId) || ym < first.get(envId)) first.set(envId, ym); };
  for (const a of d.accounts) bal.set(a.id, Number(a.openingBalance) || 0);
  for (const e of d.envelopes) touch(e.id, new Date(e.createdAt || Date.now()).toISOString().slice(0, 7));
  for (const b of d.envelopeBudgets) { over.set(b.id, Number(b.amount) || 0); touch(b.envelopeId, b.yearMonth); }
  const txs = d.transactions.slice().sort((a, b) => a.date.localeCompare(b.date));
  for (const t of txs) {
    const ym = t.date.slice(0, 7), amt = Math.abs(t.amount);
    if (t.type === 'income') { add(bal, t.accountId, amt); add(inc, ym, amt); }
    else if (t.type === 'expense') {
      add(bal, t.accountId, -amt); add(exp, ym, amt);
      if (t.envelopeId) { add(spent, `${t.envelopeId}|${ym}`, amt); touch(t.envelopeId, ym); } else add(unc, ym, amt);
    } else { add(bal, t.accountId, -amt); if (t.toAccountId) add(bal, t.toAccountId, amt); }
    if (t.type === 'expense' && t.envelopeId && t.payee) for (const tk of tokens(t.payee)) { if (!tokenVotes.has(tk)) tokenVotes.set(tk, new Map()); const m = tokenVotes.get(tk); m.set(t.envelopeId, (m.get(t.envelopeId) || 0) + 1); }
    if (t.payee && t.type !== 'transfer') payees.set(U.norm(t.payee), { name: t.payee, envelopeId: t.type === 'expense' ? t.envelopeId : null, type: t.type, date: t.date });
  }
  const c = {
    balance: (id) => U.round2(bal.get(id) || 0),
    income: (ym) => U.round2(inc.get(ym) || 0),
    expense: (ym) => U.round2(exp.get(ym) || 0),
    uncategorized: (ym) => U.round2(unc.get(ym) || 0),
    spent: (envId, ym) => U.round2(spent.get(`${envId}|${ym}`) || 0),
    budget(env, ym) { const o = over.get(`${env.id}__${ym}`); return o !== undefined ? o : Number(env.defaultBudget) || 0; },
    carry(env, ym) {
      if (!env.rollover) return 0;
      let start = first.get(env.id) || ym;
      const floor = U.shiftYM(ym, -36); if (start < floor) start = floor;
      let carry = 0;
      for (let m = start; m < ym; m = U.shiftYM(m, 1)) carry = U.round2(c.budget(env, m) + carry - c.spent(env.id, m));
      return carry;
    },
    stats(env, ym) {
      const budget = c.budget(env, ym), carry = c.carry(env, ym), sp = c.spent(env.id, ym);
      return { budget, carry, spent: sp, available: U.round2(budget + carry - sp) };
    },
    tokenVotes,
    lookupPayee: (p) => payees.get(U.norm(p)) || null,
    payeeNames: () => [...payees.values()].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 150).map((x) => x.name),
  };
  _calc = c;
  return c;
}

const activeAccounts = () => state.data.accounts.filter((a) => !a.archived);
const activeEnvelopes = () => state.data.envelopes.filter((e) => !e.archived);
const accName = (id) => (state.data.accounts.find((a) => a.id === id) || {}).name || '—';
const envById = (id) => state.data.envelopes.find((e) => e.id === id) || null;

// ------------------------------------------------------------
// Modales, toasts
// ------------------------------------------------------------
function showModal(title, bodyNode) {
  closeModal();
  const overlay = el('div', { class: 'modal-overlay', id: 'modal-overlay' });
  const modal = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    el('div', { class: 'modal-header' }, el('h2', {}, title), el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Fermer', onclick: closeModal }, '×')),
    el('div', { class: 'modal-body' }, bodyNode));
  overlay.appendChild(modal);
  overlay.addEventListener('mousedown', (e) => { if (e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  document.body.classList.add('modal-open');
  return overlay;
}

// ----- opérations récurrentes : génération automatique des occurrences échues -----
function generateRecurring() {
  const today = U.todayISO(), endYM = today.slice(0, 7), created = [], updated = [];
  for (const r of DB.all('recurring')) {
    if (!r.active || !r.amount) continue;
    const gen = new Set(r.generated || []); let changed = false, guard = 0;
    for (let ym = r.startDate.slice(0, 7); ym <= endYM && guard < 240; ym = U.shiftYM(ym, 1), guard++) {
      if (gen.has(ym)) continue;
      const date = U.dateFor(ym, r.day);
      if (date < r.startDate) continue;
      if (date > today) break;
      created.push({ id: DB.uid(), date, accountId: r.accountId, toAccountId: r.type === 'transfer' ? r.toAccountId : null, envelopeId: r.type === 'expense' ? r.envelopeId : null,
        type: r.type, amount: r.amount, payee: r.payee, notes: r.notes || '', recurringId: r.id, createdAt: Date.now() });
      gen.add(ym); changed = true;
    }
    if (changed) updated.push({ ...r, generated: [...gen] });
  }
  if (created.length) { DB.putMany('transactions', created); DB.putMany('recurring', updated); }
  return created.length;
}

function suggestEnvelope(payee) {
  const p = (payee || '').trim(); if (!p) return null;
  const c = C(), ok = (id) => { const e = envById(id); return !!e && !e.archived; };
  const hit = c.lookupPayee(p);
  if (hit && hit.envelopeId && ok(hit.envelopeId)) return { envelopeId: hit.envelopeId, source: 'habitude' };
  const votes = new Map(); let total = 0;
  for (const t of tokens(p)) { const m = c.tokenVotes.get(t); if (!m) continue; for (const [id, n] of m) { votes.set(id, (votes.get(id) || 0) + n); total += n; } }
  if (total) { const [id, n] = [...votes.entries()].sort((a, b) => b[1] - a[1])[0]; if (ok(id) && n / total >= 0.6) return { envelopeId: id, source: 'appris' }; }

}

// ---------- ajout rapide en langage naturel ----------
const WEEKDAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const INCOME_KW = /\b(salaire|paie|paye|remboursement|rembourse|prime|allocations?|apl|caf|recu|encaisse|vente)\b/;
const EDGE_STOP = new Set(['de', 'du', 'des', 'la', 'le', 'les', 'un', 'une', 'chez', 'pour', 'a', 'au', 'aux', 'sur', 'vers', 'en', 'dans', 'par', 'depense', 'achat', 'paye', 'et', 'eur', 'euro', 'euros']);
const looseRe = (w) => new RegExp('(^|[^\\p{L}\\d])' + [...w].map((ch) => ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[\\u0300-\\u036f]*').join('') + '(?![\\p{L}\\d])', 'iu');

function parseQuick(raw) {
  let s = ' ' + String(raw || '').trim().normalize('NFD') + ' ';
  if (!s.trim()) return null;
  const today = U.todayISO(); let date = today, m;
  if ((m = s.match(/\bavant[- ]hier\b/i))) { date = shiftDate(today, -2); s = s.replace(m[0], ' '); }
  else if ((m = s.match(/\bhier\b/i))) { date = shiftDate(today, -1); s = s.replace(m[0], ' '); }
  else if ((m = s.match(/\b(aujourd'?hui|ajd|auj)\b/i))) { s = s.replace(m[0], ' '); }
  else if ((m = s.match(/(^|\s)(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?![\d/])/)) && +m[3] >= 1 && +m[3] <= 12 && +m[2] >= 1 && +m[2] <= 31) {
    let y = m[4] ? +m[4] : new Date().getFullYear(); if (y < 100) y += 2000;
    let iso = `${y}-${U.pad(m[3])}-${U.pad(m[2])}`;
    if (!m[4] && iso > shiftDate(today, 1)) iso = `${y - 1}-${U.pad(m[3])}-${U.pad(m[2])}`;
    if (U.validISO(iso)) { date = iso; s = s.replace(m[0], ' '); }
  } else if ((m = s.match(/\b(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\b/i))) {
    const target = WEEKDAYS.indexOf(m[1].toLowerCase()); let back = (new Date().getDay() - target + 7) % 7; date = shiftDate(today, -back); s = s.replace(m[0], ' ');
  } else if ((m = s.match(/\ble (\d{1,2})\b(?!\s*[\/€])/i)) && +m[1] >= 1 && +m[1] <= 31) {
    const ym = U.todayYM(); let iso = U.dateFor(ym, +m[1]); if (iso > today) iso = U.dateFor(U.shiftYM(ym, -1), +m[1]); date = iso; s = s.replace(m[0], ' ');
  }
  const am = s.match(/(^|\s)([+\-−]?\d+(?:[.,]\d{1,2})?)\s*(?:€|eur(?:os?)?\b)?/i);
  if (!am) return { error: 'montant' };
  const amount = Math.abs(U.parseNumber(am[2].replace('−', '-')));
  if (!(amount > 0)) return { error: 'montant' };
  const plus = am[2].startsWith('+');
  s = s.replace(am[0], ' ');
  const low = U.norm(s.normalize('NFC'));

  // comptes cités
  const mentions = [];
  for (const a of activeAccounts()) {
    const words = [U.norm(a.name), ...U.norm(a.name).split(' ')].filter((w) => w.length >= 4 && !['compte', 'carte'].includes(w));
    for (const w of words) { const re = looseRe(w); const mm = s.match(re); if (mm) { mentions.push({ acc: a, idx: mm.index, text: mm[0].trim() }); break; } }
  }
  mentions.sort((a, b) => a.idx - b.idx);
  const wantsTransfer = /\b(virement|vir|transfert|versement|verse)\b/.test(low) && !INCOME_KW.test(low) && (mentions.length >= 1 || /\b(vers|sur)\b/.test(low));
  let type = wantsTransfer ? 'transfer' : (plus || INCOME_KW.test(low)) ? 'income' : 'expense';
  for (const mt of mentions) s = s.replace(looseRe(mt.text.normalize('NFD').replace(/[̀-ͯ]/g, '')), ' ');
  if (type === 'transfer') s = s.replace(/\b(virement|vir|transfert|versement|verse)\b/gi, ' ');

  const lastId = DB.getSetting('lastAccountId', null);
  const def = activeAccounts().find((a) => a.id === lastId) || activeAccounts()[0];
  if (!def) return { error: 'compte' };
  let accountId = def.id, toAccountId = null;
  if (type === 'transfer') {
    if (mentions.length >= 2) { accountId = mentions[0].acc.id; toAccountId = mentions[1].acc.id; }
    else if (mentions.length === 1) { toAccountId = mentions[0].acc.id; accountId = (activeAccounts().find((a) => a.id !== toAccountId && a.id === def.id) || activeAccounts().find((a) => a.id !== toAccountId) || {}).id; }
    else { type = 'expense'; }
    if (!accountId || !toAccountId || accountId === toAccountId) type = 'expense';
  } else if (mentions.length) accountId = mentions[0].acc.id;
  if (type !== 'transfer') toAccountId = null;

  let words = s.normalize('NFC').replace(/[€]/g, ' ').split(/\s+/).filter(Boolean);
  while (words.length && EDGE_STOP.has(U.norm(words[0]))) words.shift();
  while (words.length && EDGE_STOP.has(U.norm(words[words.length - 1]))) words.pop();
  let payee = words.join(' '); payee = payee.charAt(0).toUpperCase() + payee.slice(1);
  if (type === 'transfer' && !payee) payee = 'Virement';
  const sug = type === 'expense' ? suggestEnvelope(payee) : null;
  return { type, amount: U.round2(amount), date, payee, accountId, toAccountId, envelopeId: sug ? sug.envelopeId : null, source: sug ? sug.source : null };
}

// ---------- séries récurrentes (abonnements) ----------
const seriesKey = (p) => tokens(p).slice(0, 2).join(' ') || U.norm(p);
function detectSeries() {
  const groups = new Map();
  for (const t of state.data.transactions) {
    if (t.type !== 'expense' || !t.payee) continue;
    const k = seriesKey(t.payee); if (!k) continue;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(t);
  }
  const out = [], recKeys = new Set(state.data.recurring.map((r) => seriesKey(r.payee || '')));
  for (const [k, list] of groups) {
    list.sort((a, b) => a.date.localeCompare(b.date));
    const months = [...new Set(list.map((t) => t.date.slice(0, 7)))];
    if (months.length < 3) continue;
    const l3 = months.slice(-3);
    if (U.shiftYM(l3[0], 1) !== l3[1] || U.shiftYM(l3[1], 1) !== l3[2]) continue;
    if (list.length > months.length * 1.5) continue;
    const days = list.slice(-3).map((t) => +t.date.slice(8, 10));
    if (Math.max(...days) - Math.min(...days) > 6) continue;
    const amts = list.map((t) => t.amount), last3 = amts.slice(-3);
    if (Math.max(...last3) > Math.min(...last3) * 1.6) continue;
    const lastT = list[list.length - 1];
    if (lastT.date < shiftDate(U.todayISO(), -45)) continue;
    out.push({ key: k, name: lastT.payee, amount: amts[amts.length - 1], prev: median(amts.slice(0, -1).slice(-3)), day: Math.round(median(days)), envelopeId: lastT.envelopeId, accountId: lastT.accountId, hasRec: recKeys.has(k) });
  }
  return out;
}

// ---------- prévision « reste à vivre » ----------
function forecast() {
  const c = C(), ym = U.todayYM(), today = U.todayISO();
  const liq = activeAccounts().filter((a) => a.type !== 'Épargne');
  const base = liq.length ? liq : activeAccounts();
  const liquid = U.round2(base.reduce((s, a) => s + c.balance(a.id), 0));
  let upExp = 0, upInc = 0; const items = [];
  for (const r of state.data.recurring) {
    if (!r.active || !r.amount || (r.generated || []).includes(ym)) continue;
    const date = U.dateFor(ym, r.day);
    if (date <= today || date < r.startDate) continue;
    const fromL = isLiquid(r.accountId), toL = r.type === 'transfer' && isLiquid(r.toAccountId);
    let d = 0;
    if (r.type === 'expense') d = -r.amount; else if (r.type === 'income') d = r.amount; else d = (toL ? r.amount : 0) - (fromL ? r.amount : 0);
    if (!d) continue;
    if (d < 0) upExp += -d; else upInc += d;
    items.push({ r, date, d });
  }
  const daysLeft = U.daysInMonth(ym) - Number(today.slice(8, 10)) + 1;
  const rest = U.round2(liquid - upExp + upInc);
  return { liquid, upExp: U.round2(upExp), upInc: U.round2(upInc), items, rest, daysLeft, perDay: rest / daysLeft };
}

// ---------- conseils ----------
function envMonthTx(envId, ym) { return state.data.transactions.filter((t) => t.envelopeId === envId && t.type === 'expense' && t.date.slice(0, 7) === ym); }
function avgSavings(n = 3) {

  for (let i = 1; i <= n; i++) { const m = U.shiftYM(cur, -i); if (c.income(m) || c.expense(m)) v.push(c.income(m) - c.expense(m)); }
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0;
}
function computeInsights() {
  const c = C(), ym = state.month, thisYM = U.todayYM(), isCur = ym === thisYM, today = U.todayISO();
  const dim = U.daysInMonth(ym), day = isCur ? Number(today.slice(8, 10)) : dim;
  const dismissed = new Set(DB.getSetting('dismissed', []));

    }

function ring(pct, size, stroke, colorVar, centerText, sub) {
  const R = (size - stroke) / 2, CIRC = 2 * Math.PI * R, c = size / 2;
  const s = svg('svg', { viewBox: `0 0 ${size} ${size}`, width: size, height: size, role: 'img', 'aria-label': `${Math.round(pct * 100)} %` });
  s.appendChild(svg('circle', { cx: c, cy: c, r: R, fill: 'none', 'stroke-width': stroke, style: 'stroke:var(--bar-bg)' }));
  s.appendChild(svg('circle', { cx: c, cy: c, r: R, fill: 'none', 'stroke-width': stroke, 'stroke-linecap': 'round', style: `stroke:${colorVar}`, 'stroke-dasharray': `${Math.max(0, Math.min(1, pct)) * CIRC} ${CIRC}`, transform: `rotate(-90 ${c} ${c})` }));
  s.appendChild(svg('text', { x: c, y: c + (sub ? 2 : 6), 'text-anchor': 'middle', class: 'ring-t', style: `font-size:${size * 0.24}px` }, centerText));
  if (sub) s.appendChild(svg('text', { x: c, y: c + size * 0.2, 'text-anchor': 'middle', class: 'ring-s', style: `font-size:${size * 0.11}px` }, sub));
  return s;
}

function lineChart(points) {
  const W = 360, H = 150, L = 6, R = 6, T = 22, B = 20, pw = W - L - R, ph = H - T - B;
  const vals = points.map((p) => p.v), lo = Math.min(...vals, 0), hi = Math.max(...vals, 1), span = hi - lo || 1;
  const x = (i) => L + (points.length === 1 ? pw / 2 : (pw * i) / (points.length - 1)), y = (v) => T + ph - ((v - lo) / span) * ph;
  const s = svg('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Évolution du solde' });
  if (lo < 0) s.appendChild(svg('line', { x1: L, x2: W - R, y1: y(0), y2: y(0), style: 'stroke:var(--muted);stroke-dasharray:3 3;opacity:.6' }));
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  s.appendChild(svg('path', { d: `${d} L${x(points.length - 1)} ${T + ph} L${x(0)} ${T + ph} Z`, style: 'fill:var(--primary);opacity:.12' }));
  s.appendChild(svg('path', { d, fill: 'none', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', style: 'stroke:var(--primary)' }));
  points.forEach((p, i) => {
    s.appendChild(svg('circle', { cx: x(i), cy: y(p.v), r: i === points.length - 1 ? 4 : 8, style: i === points.length - 1 ? 'fill:var(--primary);stroke:var(--surface);stroke-width:2' : 'fill:transparent' }, svg('title', {}, `${U.ymLabel(p.ym)} : ${money(p.v)}`)));
    if (i % 3 === (points.length - 1) % 3) s.appendChild(svg('text', { x: x(i), y: H - 5, 'text-anchor': i === 0 ? 'start' : 'middle' }, U.ymShort(p.ym)));
  });
  const lastP = points[points.length - 1];
  s.appendChild(svg('text', { x: W - R, y: 12, 'text-anchor': 'end', style: 'fill:var(--text);font-weight:700;font-size:12px' }, money(lastP.v)));
  return s;
}
function balanceSeries(endYM, n) {
  const act = activeAccounts(), ids = new Set(act.map((a) => a.id)), delta = new Map();
  const add = (ym, v) => delta.set(ym, (delta.get(ym) || 0) + v);
  for (const t of state.data.transactions) {
    const ym = t.date.slice(0, 7);
    if (t.type === 'income' && ids.has(t.accountId)) add(ym, t.amount);
    else if (t.type === 'expense' && ids.has(t.accountId)) add(ym, -t.amount);
    else if (t.type === 'transfer') { if (ids.has(t.accountId)) add(ym, -t.amount); if (ids.has(t.toAccountId)) add(ym, t.amount); }
  }
  const open = act.reduce((s, a) => s + (Number(a.openingBalance) || 0), 0), keys = [...delta.keys()].sort();
  return Array.from({ length: n }, (_, i) => U.shiftYM(endYM, i - n + 1)).map((ym) => ({ ym, v: U.round2(open + keys.filter((k) => k <= ym).reduce((s, k) => s + delta.get(k), 0)) }));
}

function segmented(options, value, onChange) {
  const wrap = el('div', { class: 'seg', role: 'group' });
  const btns = options.map(([v, label]) => el('button', { type: 'button', 'data-v': v, class: v === value ? 'on' : '', onclick: () => set(v) }, label));
  btns.forEach((b) => wrap.appendChild(b));
  function set(v) { btns.forEach((b) => b.classList.toggle('on', b.dataset.v === v)); onChange(v); }
  return wrap;
}
const row = (label, ...ctrl) => el('div', { class: 'form-row' }, label ? el('label', {}, label) : null, ...ctrl);
const opt = (v, t) => el('option', { value: v }, t);
const parseField = (v) => (String(v).trim() === '' ? NaN : U.parseNumber(v));

// Champs communs à une opération et à une récurrence
function txFields(init, { withDate = true } = {}) {
  let type = init.type || 'expense';
  const accs = state.data.accounts.filter((a) => !a.archived || a.id === init.accountId || a.id === init.toAccountId);
  const envs = state.data.envelopes.filter((e) => !e.archived || e.id === init.envelopeId);
  const amount = el('input', { type: 'text', inputmode: 'decimal', class: 'amount-input', name: 'amount', autocomplete: 'off', placeholder: '0,00', 'aria-label': 'Montant', value: init.amount ? U.fmtInput(init.amount) : '' });
  const payee = el('input', { type: 'text', name: 'payee', list: 'payee-list', autocomplete: 'off', placeholder: 'Carrefour, Salaire…', value: init.payee || '' });
  const accSel = el('select', { name: 'accountId' }, accs.map((a) => opt(a.id, a.name)));
  const toSel = el('select', { name: 'toAccountId' }, accs.map((a) => opt(a.id, a.name)));
  const envSel = el('select', { name: 'envelopeId' }, opt('', '(aucune)'), envs.map((e) => opt(e.id, e.name)));
  accSel.value = init.accountId || (accs[0] || {}).id || '';
  toSel.value = init.toAccountId || (accs.find((a) => a.id !== accSel.value) || {}).id || '';
  envSel.value = init.envelopeId || '';
  let envTouched = !!init.envelopeId;
  envSel.addEventListener('change', () => { envTouched = true; });
  const rowTo = row('Vers le compte', toSel), rowEnv = row('Enveloppe', envSel);
  const accLabel = el('label', {}, 'Compte');
  const rowAcc = el('div', { class: 'form-row' }, accLabel, accSel);
  const dl = el('datalist', { id: 'payee-list' }, C().payeeNames().map((n) => el('option', { value: n })));
  function applyType() {
    rowTo.hidden = type !== 'transfer';
    rowEnv.hidden = type !== 'expense';
    accLabel.textContent = type === 'transfer' ? 'Du compte' : 'Compte';
  }
  // pré-remplit l'enveloppe depuis le dernier usage du même libellé
  const suggest = () => {
    if (envTouched || type !== 'expense') return;
    const sg = suggestEnvelope(payee.value);
    if (sg && envs.some((e) => e.id === sg.envelopeId)) envSel.value = sg.envelopeId;
  };
  payee.addEventListener('change', suggest); payee.addEventListener('blur', suggest);
  const seg = segmented([['expense', 'Dépense'], ['income', 'Revenu'], ['transfer', 'Virement']], type, (v) => { type = v; applyType(); });
  applyType();
  return {
    seg, amount, payee, accSel, toSel, envSel, rowTo, rowEnv, rowAcc, dl,
    get type() { return type; },
    read() {
      const a = parseField(amount.value);
      if (!(a > 0)) return { error: 'Saisis un montant supérieur à 0', focus: amount };
      if (!accSel.value) return { error: 'Choisis un compte' };
      if (type === 'transfer') {
        if (!toSel.value || toSel.value === accSel.value) return { error: 'Choisis deux comptes différents' };
      }
      return { value: { type, amount: U.round2(a), accountId: accSel.value, toAccountId: type === 'transfer' ? toSel.value : null, envelopeId: type === 'expense' ? (envSel.value || null) : null, payee: payee.value.trim(), } };
    },
  };
}

// ============================================================ Import CSV bancaire
async function importCsvFile(file) {
  let rows;
  try { rows = U.parseCSV(await readText(file)); } catch { toast('Fichier illisible', 'error'); return; }
  if (rows.length < 2) { toast('Fichier vide ou non reconnu', 'error'); return; }
  if (rows.length > 20000) { toast('Fichier trop volumineux (20 000 lignes max)', 'error'); return; }
  if (!state.data.accounts.some((a) => !a.archived)) { toast("Crée d'abord un compte", 'error'); setView('accounts'); return; }
  openCsvImport(rows);
}

function openCsvImport(rows) {
  // on garde les lignes qui ont la largeur la plus fréquente (ignore les préambules des banques)
  const freq = new Map(); rows.forEach((r) => freq.set(r.length, (freq.get(r.length) || 0) + 1));
  const width = [...freq.entries()].sort((a, b) => b[1] - a[1])[0][0];
  const data = rows.filter((r) => r.length === width);
  const hasHeader = !data[0].some((c) => U.parseDateLoose(c));
  const header = hasHeader ? data[0].map((h) => String(h).trim() || '(vide)') : data[0].map((_, i) => `Colonne ${i + 1}`);
  const body = (hasHeader ? data.slice(1) : data).slice(0, 5000);
  if (!body.length) { toast('Aucune ligne de données trouvée', 'error'); return; }

  const find = (re) => header.findIndex((h) => re.test(U.norm(h)));
  let cDate = find(/date/); if (cDate < 0) cDate = header.findIndex((_, i) => U.parseDateLoose(body[0][i]));
  let cDeb = find(/debit/), cCred = find(/credit/), cAmt = find(/^(montant|amount|somme|valeur)/);
  if (cAmt < 0 && cDeb < 0 && cCred < 0) cAmt = header.findIndex((_, i) => i !== cDate && !Number.isNaN(U.parseNumber(body[0][i])));
  let cLabel = find(/libelle|label|description|intitule|objet|detail|beneficiaire|payee|tiers|nom/);
  if (cLabel < 0) cLabel = header.findIndex((_, i) => ![cDate, cAmt, cDeb, cCred].includes(i));
  const cfg = { date: cDate, label: cLabel, amount: cAmt, debit: cDeb, credit: cCred, invert: false, accountId: (activeAccounts()[0] || {}).id };

  const colSel = (key, withNone) => {
    const s = el('select', { onchange: (e) => { cfg[key] = Number(e.target.value); update(); } }, withNone ? opt(-1, '— aucune —') : null, header.map((h, i) => opt(i, h)));
    s.value = String(cfg[key]); return s;
  };
  const accSel = el('select', { onchange: (e) => { cfg.accountId = e.target.value; update(); } }, activeAccounts().map((a) => opt(a.id, a.name)));
  const inv = el('input', { type: 'checkbox', onchange: (e) => { cfg.invert = e.target.checked; update(); } });
  const info = el('div'), preview = el('div', { style: 'overflow-x:auto' });
  const importBtn = el('button', { type: 'button', class: 'btn btn-primary' }, 'Importer');
  let result = null;

  function compute() {
    const items = []; let bad = 0;
    for (const r of body) {
      const date = U.parseDateLoose(r[cfg.date]);
      let amt = NaN;
      if (cfg.amount >= 0 && String(r[cfg.amount] || '').trim() !== '') amt = U.parseNumber(r[cfg.amount]);
      else if (cfg.debit >= 0 || cfg.credit >= 0) {
        const d = cfg.debit >= 0 ? U.parseNumber(r[cfg.debit]) : NaN, c = cfg.credit >= 0 ? U.parseNumber(r[cfg.credit]) : NaN;
        if (!Number.isNaN(d) || !Number.isNaN(c)) amt = (Number.isNaN(c) ? 0 : Math.abs(c)) - (Number.isNaN(d) ? 0 : Math.abs(d));
      }
      if (!date || !Number.isFinite(amt) || amt === 0) { bad++; continue; }
      if (cfg.invert) amt = -amt;
      const payee = cfg.label >= 0 ? String(r[cfg.label] || '').trim().replace(/\s+/g, ' ').slice(0, 120) : '';
      items.push({ date, type: amt < 0 ? 'expense' : 'income', amount: U.round2(Math.abs(amt)), payee });
    }
    // doublons : une ligne déjà présente (même compte, date, montant, libellé) consomme une occurrence
    const seen = new Map();
    for (const t of state.data.transactions) if (t.accountId === cfg.accountId && t.type !== 'transfer') { const k = `${t.date}|${t.type}|${t.amount.toFixed(2)}|${U.norm(t.payee)}`; seen.set(k, (seen.get(k) || 0) + 1); }
    const fresh = []; let dups = 0;
    for (const it of items) { const k = `${it.date}|${it.type}|${it.amount.toFixed(2)}|${U.norm(it.payee)}`; if (seen.get(k) > 0) { seen.set(k, seen.get(k) - 1); dups++; } else fresh.push(it); }
    return { fresh, dups, bad };
  }
  function update() {
    result = compute();
    const { fresh, dups, bad } = result;
    info.textContent = ''; info.append(el('b', {}, `${fresh.length} opération(s) à importer`), `${dups ? ` · ${dups} déjà présente(s) (ignorées)` : ''}${bad ? ` · ${bad} ligne(s) illisible(s)` : ''}`);
    preview.textContent = '';
    if (fresh.length) preview.appendChild(el('table', { class: 'preview' }, el('tbody', {}, fresh.slice(0, 5).map((it) => el('tr', {}, el('td', {}, it.date), el('td', {}, it.payee || '—'),
      el('td', { class: it.type === 'expense' ? 'neg' : 'pos', style: 'text-align:right' }, U.fmtSigned(it.type === 'expense' ? -it.amount : it.amount, state.currency)))))));
    importBtn.disabled = !fresh.length; importBtn.style.opacity = fresh.length ? '' : '.5';
  }
  importBtn.addEventListener('click', () => {
    const c = C(); const now = Date.now();
    const txs = result.fresh.map((it, i) => {
      const sg = it.type === 'expense' ? suggestEnvelope(it.payee) : null;
      const env = sg ? sg.envelopeId : null;
      return { id: DB.uid(), date: it.date, accountId: cfg.accountId, toAccountId: null, envelopeId: env, type: it.type, amount: it.amount, payee: it.payee, notes: '', recurringId: null, createdAt: now + i };
    });
    DB.putMany('transactions', txs); closeModal(); commit();
    const uncat = txs.filter((t) => t.type === 'expense' && !t.envelopeId).length;
    toast(`${txs.length} opération(s) importée(s)${uncat ? ` · ${uncat} sans enveloppe` : ''}`, 'success');
  });

  const form = el('div', { class: 'form' },
    el('p', { class: 'muted', style: 'margin:0' }, "Vérifie que les colonnes sont les bonnes. Les dépenses sont détectées par un montant négatif (ou la colonne « Débit »). Les doublons déjà présents sont ignorés."),
    row('Importer dans le compte', accSel),
    el('div', { class: 'form-grid' }, row('Colonne date', colSel('date', false)), row('Colonne libellé', colSel('label', true))),
    el('div', { class: 'form-grid' }, row('Colonne montant', colSel('amount', true)), row('…ou colonne Débit', colSel('debit', true))),
    row('…et colonne Crédit', colSel('credit', true)),
    el('label', { class: 'checkrow' }, inv, el('span', {}, 'Inverser le signe (si les dépenses sortent en positif)')),
    info, preview,
    el('div', { class: 'modal-actions' }, el('button', { type: 'button', class: 'btn', onclick: closeModal }, 'Annuler'), importBtn));
  showModal('Importer un relevé CSV', form);
  update();
}

// ---------- « Puis-je me l'offrir ? » ----------
function openSimulator(preset = {}) {
  const amount = el('input', { type: 'text', inputmode: 'decimal', class: 'amount-input', placeholder: '0,00', autocomplete: 'off', value: preset.amount ? U.fmtInput(preset.amount) : '' });
  const envSel = el('select', {}, opt('', '(aucune enveloppe)'), activeEnvelopes().map((e) => opt(e.id, e.name)));
  const out = el('div');
  function update() {
    out.textContent = '';
    const a = U.parseNumber(amount.value); if (!(a > 0)) return;
    const f = forecast(), after = U.round2(f.rest - a), perAfter = after / f.daysLeft;
    let tone = 'ok', title = '✅ Tu peux te le permettre';
    if (after < 0) { tone = 'bad'; title = '⛔ Pas ce mois-ci'; } else if (perAfter < 8) { tone = 'warn'; title = '⚠️ Possible mais serré'; }
    const lines = [el('div', {}, 'Reste à vivre : ', el('b', {}, money(f.rest)), ' → ', el('b', { class: after < 0 ? 'neg' : '' }, money(after))),
      el('div', {}, 'Par jour : ', el('b', {}, money(Math.max(0, f.perDay))), ' → ', el('b', {}, money(Math.max(0, perAfter))), ` (${f.daysLeft} jour${f.daysLeft > 1 ? 's' : ''} restants)`)];
    const env = envById(envSel.value);
    if (env) { const st = C().stats(env, U.todayYM()), av = U.round2(st.available - a); lines.push(el('div', {}, `Enveloppe ${env.name} : `, el('b', {}, money(st.available)), ' → ', el('b', { class: av < 0 ? 'neg' : '' }, money(av)), av < 0 ? ' (budget dépassé)' : '')); }
    const sv = avgSavings();
    if (tone !== 'ok') lines.push(el('div', { class: 'muted' }, sv > 0 ? `Avec ton épargne moyenne (${money(sv)}/mois), mets-le de côté pendant ≈ ${Math.ceil(a / sv)} mois.` : "Tu n'as pas de marge d'épargne récente : un objectif d'épargne t'aidera à l'anticiper."));
    out.append(el('div', { class: `verdict ${tone}` }, el('b', {}, title), lines),
      el('div', { class: 'modal-actions', style: 'margin-top:10px' },
        el('button', { type: 'button', class: 'btn', onclick: () => { closeModal(); openGoalModal(null, { name: '', target: a }); } }, '🎯 En faire un objectif'),
        el('button', { type: 'button', class: 'btn btn-primary', onclick: () => { closeModal(); openTxModal(null, { type: 'expense', amount: a, envelopeId: envSel.value || null }); } }, 'Enregistrer la dépense')));
  }
  amount.addEventListener('input', update); envSel.addEventListener('change', update);
  showModal('Puis-je me l\'offrir ?', el('div', { class: 'form' }, el('p', { class: 'muted', style: 'margin:0' }, "Simulation sur ton reste à vivre de ce mois-ci (comptes hors épargne, récurrences à venir incluses)."), row('Prix', amount), row('Enveloppe concernée', envSel), out));
  setTimeout(() => amount.focus(), 60); update();
}

// ---------- budgets suggérés ----------
function openBudgetSuggest() {
  const c = C(), cur = U.todayYM(), prev = [1, 2, 3].map((i) => U.shiftYM(cur, -i));
  const rows = activeEnvelopes().map((env) => {
    const vals = prev.map((m) => c.spent(env.id, m)).filter((v) => v > 0), avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    return { env, avg, sug: avg ? Math.ceil(avg / 5) * 5 : 0 };
  });
  if (!rows.some((r) => r.avg > 0)) { toast("Pas encore assez d'historique (il faut des dépenses sur les mois précédents)", 'info'); return; }
  const incAvg = prev.map((m) => c.income(m)).filter((v) => v > 0);
  const inputs = rows.map((r) => ({ ...r, chk: el('input', { type: 'checkbox', checked: r.avg > 0 }), inp: el('input', { type: 'text', inputmode: 'decimal', class: 'input-sm', value: r.sug ? U.fmtInput(r.sug) : '', 'aria-label': `Budget ${r.env.name}` }) }));
  const total = el('div', { class: 'muted' });
  const recalc = () => {
    const t = inputs.reduce((s, r) => s + (r.chk.checked ? (U.parseNumber(r.inp.value) || 0) : (Number(r.env.defaultBudget) || 0)), 0);
    total.textContent = `Total des budgets : ${money(t)}` + (incAvg.length ? ` · revenus moyens : ${money(incAvg.reduce((a, b) => a + b, 0) / incAvg.length)}` : '');
  };
  inputs.forEach((r) => { r.inp.addEventListener('input', recalc); r.chk.addEventListener('change', recalc); });
  const body = el('div', { class: 'form' },
    el('p', { class: 'muted', style: 'margin:0' }, 'Moyenne de tes dépenses sur les 3 derniers mois, arrondie aux 5 € supérieurs. Ajuste, décoche ce que tu ne veux pas changer.'),
    el('div', {}, inputs.map((r) => el('div', { class: 'sug-row' }, r.chk, el('span', { class: 'dot', style: `background:${r.env.color}` }), el('div', { style: 'min-width:0' }, el('div', { class: 'nm' }, r.env.name), el('div', { class: 'muted' }, r.avg ? `moy. ${money(r.avg)}${r.env.defaultBudget ? ` · actuel ${money(r.env.defaultBudget)}` : ''}` : 'pas de dépense')), r.inp))),
    total, el('div', { class: 'modal-actions' }, el('button', { type: 'button', class: 'btn', onclick: closeModal }, 'Annuler'),
      el('button', { type: 'button', class: 'btn btn-primary', onclick: () => {
        const upd = inputs.filter((r) => r.chk.checked).map((r) => ({ ...r.env, defaultBudget: Math.max(0, U.round2(U.parseNumber(r.inp.value) || 0)) }));
        DB.putMany('envelopes', upd); closeModal(); commit(); toast(`${upd.length} budget(s) mensuel(s) défini(s)`, 'success');
      } }, 'Appliquer comme budgets par défaut')));
  showModal('🪄 Budgets suggérés', body); recalc();
}

// ---------- détail du reste à vivre ----------
function openForecastModal() {
  const f = forecast(), liq = activeAccounts().filter((a) => a.type !== 'Épargne');
  const line = (l, v, cls = '') => el('div', { class: 'fl' }, el('span', {}, l), el('b', { class: `tnum ${cls}` }, v));
  showModal('Reste à vivre — détail', el('div', {},
    el('p', { class: 'muted', style: 'margin-top:0' }, `Solde de tes comptes hors épargne (${liq.length ? liq.map((a) => a.name).join(', ') : 'tous les comptes'}), moins les opérations récurrentes encore à venir ce mois-ci.`),
    line('Solde actuel', money(f.liquid)),
    ...f.items.sort((a, b) => a.date.localeCompare(b.date)).map((i) => line(`${i.date.slice(8)}/${i.date.slice(5, 7)} · ${i.r.payee || 'Récurrente'}`, U.fmtSigned(i.d, state.currency), i.d < 0 ? 'neg' : 'pos')),
    el('hr', { style: 'border:none;border-top:1px solid var(--border)' }),
    line('Reste à vivre', money(f.rest), f.rest < 0 ? 'neg' : 'pos'),
    line(`Par jour (${f.daysLeft} j)`, money(Math.max(0, f.perDay))),
    el('p', { class: 'muted' }, 'Les dépenses variables (courses, sorties…) ne sont pas anticipées : c\'est ce que tu peux encore dépenser, pas ce que tu dépenseras.'),
    el('div', { class: 'modal-actions' }, el('button', { class: 'btn', onclick: () => { closeModal(); openSimulator(); } }, '🛍️ Simuler un achat'), el('button', { class: 'btn btn-primary', onclick: closeModal }, 'OK'))));
}

// ============================================================
// main.js — rendu et démarrage
// ============================================================
function render() {
  renderChrome();
  const root = document.getElementById('app-main');
  root.textContent = '';
  if (!DB.status.persistent || !DB.status.ok) {
    root.appendChild(el('div', { class: 'banner err' }, !DB.status.persistent
      ? "⚠️ Le stockage du navigateur est indisponible (navigation privée ?). Tes données seront perdues à la fermeture — exporte une sauvegarde."
      : "⚠️ Impossible d'enregistrer (stockage plein ou bloqué). Exporte une sauvegarde dès maintenant.",
      el('div', { class: 'actions' }, el('button', { class: 'btn btn-sm', onclick: exportJSON }, 'Sauvegarder'))));
  }
  const views = { dashboard: viewDashboard, transactions: viewTransactions, envelopes: viewEnvelopes, accounts: viewAccounts, recurring: viewRecurring, settings: viewSettings, goals: viewGoals, more: viewMore, review: viewReview };
  try { (views[state.view] || viewDashboard)(root); }
  catch (e) {
    console.error(e);
    root.appendChild(el('div', { class: 'banner err' }, "Une erreur d'affichage est survenue : ", String(e && e.message || e)));
  }
}

function init() {
  if (!DB.getSetting('seeded', false)
      && !DB.all('accounts').length && !DB.all('envelopes').length && !DB.all('transactions').length) seedStarter();
  else if (!DB.getSetting('seeded', false)) DB.setSetting('seeded', true);   // données d'une ancienne version
  generateRecurring();
  reloadData();
  try { checkBadges(); } catch (e) { console.warn(e); }
  applyTheme();
  document.getElementById('fab').addEventListener('click', () => openTxModal());
  render();

  window.addEventListener('db-error', () => { toast("Échec de l'enregistrement : stockage plein ou bloqué", 'error'); render(); });
  // l'appli reste ouverte des jours sur téléphone : on rattrape les récurrences au retour au premier plan
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (generateRecurring()) { commit(); toast('Opérations récurrentes ajoutées', 'info'); }
  });
  // autre onglet qui modifie les données
  window.addEventListener('storage', (e) => {
    if (e.key && e.key.startsWith('budget-app__')) { DB.invalidate(); if (!document.getElementById('modal-overlay')) commit(); }
  });
  document.addEventListener('keydown', (e) => {   // raccourci ordinateur : N = nouvelle opération
    const tag = (document.activeElement || {}).tagName;
    if (e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey && !e.altKey && !['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) && !document.getElementById('modal-overlay')) { e.preventDefault(); openTxModal(); }
  });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(() => {});
}
document.addEventListener('DOMContentLoaded', init);

  </script>
